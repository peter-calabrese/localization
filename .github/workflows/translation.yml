name: Update translations

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out application repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find changed locale files
        id: locales
        shell: bash
        env:
          CONFIGURED_LOCALES_ROOT: ${{ vars.LOCALES_ROOT }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          locales_root="${CONFIGURED_LOCALES_ROOT:-src/locales}"
          source_root="${locales_root}/en"

          echo "locales_root=$locales_root" >> "$GITHUB_OUTPUT"

          if [[ ! -d "$source_root" ]]; then
            echo "::error::Locale source directory does not exist: $source_root"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            files="$(
              find "$source_root" -type f -name '*.json' -print | sort
            )"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            files="$(
              git diff-tree \
                --no-commit-id \
                --name-only \
                --diff-filter=AMR \
                -r "$CURRENT_SHA" \
                -- "$source_root" |
              awk '/\.json$/'
            )"
          else
            files="$(
              git diff \
                --name-only \
                --diff-filter=AMR \
                "$BEFORE_SHA" \
                "$CURRENT_SHA" \
                -- "$source_root" |
              awk '/\.json$/'
            )"
          fi

          if [[ -z "$files" ]]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No changed locale files found."
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            {
              echo "files<<EOF"
              echo "$files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"

            echo "Files selected for translation:"
            echo "$files"
          fi

      - name: Restore translation cache
        if: steps.locales.outputs.has_files == 'true'
        uses: actions/cache@v5
        with:
          path: .translation-cache
          key: translation-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            translation-cache-${{ runner.os }}-

      - name: Generate translations
        id: translate
        if: steps.locales.outputs.has_files == 'true'
        uses: peter-calabrese/localization@v1
        with:
          files: ${{ steps.locales.outputs.files }}
          locales-root: ${{ steps.locales.outputs.locales_root }}
          languages: ${{ vars.TRANSLATION_LANGUAGES || 'es,fr' }}
        env:
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}

      - name: Open translation pull request
        if: steps.locales.outputs.has_files == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-translations
          delete-branch: true
          commit-message: "chore: update translations"
          title: "chore: update translations"
          body: |
            Automated translations for changed English locale files.

            Source commit: ${{ github.sha }}
          add-paths: |
            ${{ steps.translate.outputs.translated-paths }}
