name: Translate locale files
description: Translate English locale files

inputs:
  files:
    description: Locale JSON files to translate
    required: true
  locales-root:
    description: Root directory containing language folders
    required: false
    default: src/locales
  languages:
    description: Comma-separated or multiline target language codes
    required: false
    default: |
      es
      fr

outputs:
  translated-paths:
    description: Newline-delimited repository paths generated by the action

runs:
  using: node24
  main: dist/index.mjs
